name: Deploy via SSH

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - production

jobs:
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment
        id: set-env
        # When using GH UI, returns this value, else main = production and other = stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=stage" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: SSH Deploy (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: Show environment
        run: |
          echo "Deploying to environment: ${{ needs.resolve-env.outputs.environment }}"

      - name: Install sshpass
        run: |
          sudo apt-get install -y sshpass

      - name: Testing to establish SSH connection server
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -v -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "true"

      - name: Deploy to server via SSH
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -v -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} <<'ENDSSH'
          cd ${{ secrets.SSH_PROJECT_PATH }} &&
          git pull &&
          NODE_ENV=production npm install &&
          ENVIRONMENT=node NODE_OPTIONS=--max-old-space-size=4096 npm run build
          ENDSSH
