name: Deploy via SSH

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - production

jobs:
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment
        id: set-env
        # When using GH UI, returns this value, else main = production and other = stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=stage" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: SSH Deploy (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: Show environment
        run: |
          echo "Deploying to environment: ${{ needs.resolve-env.outputs.environment }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ vars.NODE_VERSION }}'
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_ENV: production
        run: npm ci

      - name: Build
        env:
          ENVIRONMENT: node
        run: npm run build

      - name: Install sshpass & rsync
        run: sudo apt-get install -y sshpass rsync

      - name: Deploy build via rsync
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./build/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PROJECT_PATH }}/build/

