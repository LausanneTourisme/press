name: Deploy project !

on:
  workflow_run:
    workflows:
      - Test
    branches:
      - main
      - develop
    types:
      - completed

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'Stage'
        type: choice
        options:
          - Stage
          - Production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'Production' || 'Stage') }}
  cancel-in-progress: false

jobs:
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment
        id: set-env
        # When using GH UI, returns this value, else main = production and other = stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "environment=Production" >> $GITHUB_OUTPUT
          else
            echo "environment=Stage" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: SSH Deploy (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sshpass & rsync
        run: sudo apt-get install -y sshpass rsync

      - name: Deploy .env
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cat > ${{ secrets.SSH_PROJECT_PATH }}/.env << 'EOF'
          ENABLE_CRM='${{secrets.ENABLE_CRM}}'
          APSIS_CLIENT_ID='${{secrets.APSIS_CLIENT_ID}}'
          APSIS_CLIENT_SECRET='${{secrets.APSIS_CLIENT_SECRET}}'
          APSIS_KEYSPACE_DISCRIMINATOR='${{secrets.APSIS_KEYSPACE_DISCRIMINATOR}}'
          APSIS_SECTION_DISCRIMINATOR='${{secrets.APSIS_SECTION_DISCRIMINATOR}}'
          APSIS_CONSENTS_MEDIA_PRESS_DISCRIMINATOR='${{secrets.APSIS_CONSENTS_MEDIA_PRESS_DISCRIMINATOR}}'
          APSIS_CONSENTS_CONTENT_MEDIA_CREATOR_DISCRIMINATOR='${{secrets.APSIS_CONSENTS_CONTENT_MEDIA_CREATOR_DISCRIMINATOR}}'
          APSIS_CONSENTS_NEWSLETTER_PRESS_DISCRIMINATOR='${{secrets.APSIS_CONSENTS_NEWSLETTER_PRESS_DISCRIMINATOR}}'
          APSIS_JOURNALIST_FORM_EVENT_VERSION_ID='${{secrets.APSIS_JOURNALIST_FORM_EVENT_VERSION_ID}}'
          APSIS_CONTENT_CREATOR_FORM_EVENT_VERSION_ID='${{secrets.APSIS_CONTENT_CREATOR_FORM_EVENT_VERSION_ID}}'
          APSIS_MEDIA_COVERAGE_FORM_EVENT_VERSION_ID='${{secrets.APSIS_MEDIA_COVERAGE_FORM_EVENT_VERSION_ID}}'
          PUBLIC_ENABLE_OFFLINE_MODE='${{ secrets.PUBLIC_ENABLE_OFFLINE_MODE }}'
          PUBLIC_CLOUDINARY_CLOUD_NAME='${{ secrets.PUBLIC_CLOUDINARY_CLOUD_NAME }}'
          PUBLIC_CLOUDINARY_CNAME='${{ secrets.PUBLIC_CLOUDINARY_CNAME }}'
          PUBLIC_CLOUDINARY_UPLOAD_PRESET='${{ secrets.PUBLIC_CLOUDINARY_UPLOAD_PRESET }}'
          GRAPHQL_URL='${{ secrets.GRAPHQL_URL }}'
          GRAPHQL_TOKEN='${{ secrets.GRAPHQL_TOKEN }}'
          GRAPHQL_AGENDA_TOKEN='${{ secrets.GRAPHQL_AGENDA_TOKEN }}'
          GROUP_ID_PAGE_HIGHLIGHTS=${{ secrets.GROUP_ID_PAGE_HIGHLIGHTS }}
          PUBLIC_MAPTILER_URL='${{ secrets.PUBLIC_MAPTILER_URL }}'
          BOTPOISON_SKEY='${{ secrets.BOTPOISON_SKEY }}'
          PUBLIC_BOTPOISON_PUBLICKEY='${{ secrets.PUBLIC_BOTPOISON_PUBLICKEY }}'
          PUBLIC_MANDRILL_API_KEY='${{ secrets.PUBLIC_MANDRILL_API_KEY }}'
          MAIL_DEFAULT_RECIPIENTS='${{ secrets.MAIL_DEFAULT_RECIPIENTS }}'
          MAIL_FROM='${{ secrets.MAIL_FROM }}'
          MAIL_TO='${{ secrets.MAIL_TO }}'
          MAIL_HOST='${{ secrets.MAIL_HOST }}'
          MAIL_PORT='${{ secrets.MAIL_PORT }}'
          MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}'
          MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}'
          ENABLE_MAILCHIMP='${{ secrets.ENABLE_MAILCHIMP }}'
          API_HTML_TO_PDF='${{ secrets.API_HTML_TO_PDF }}'
          PUBLIC_GOOGLE_TAG_MANAGER_TOKEN='${{ secrets.PUBLIC_GOOGLE_TAG_MANAGER_TOKEN }}'
          EOF"

      - name: Sync src files
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' rsync -azsc --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./src/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PROJECT_PATH }}/src/

      - name: Sync static files
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./static/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PROJECT_PATH }}/static/

      - name: Sync build files
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' rsync -az \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./package.json \
            ./package-lock.json \
            ./.nvmrc \
            ./svelte.config.js \
            ./vite.config.ts \
            ./tsconfig.json \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PROJECT_PATH }}/

      - name: Install dependencies & build
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "/bin/bash -c '. \$HOME/.nvm/nvm.sh && cd ${{ secrets.SSH_PROJECT_PATH }} && npm ci && ENVIRONMENT=node BUILD_DIR=build-next npm run build'"

      - name: Swap builds
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.SSH_PROJECT_PATH }} && \
             mv build build-old && \
             mv build-next build"

      - name: Restart
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "systemctl --user daemon-reload && systemctl --user restart ${{ secrets.SERVICE_NAME }}"

      # Wait a bit and check if the service is active, if not, rollback to the old build and restart again
      - name: Verify
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "sleep 3 && \
             systemctl --user is-active ${{ secrets.SERVICE_NAME }} || \
             (rm -rf ${{ secrets.SSH_PROJECT_PATH }}/build && \
              mv ${{ secrets.SSH_PROJECT_PATH }}/build-old ${{ secrets.SSH_PROJECT_PATH }}/build && \
              systemctl --user restart ${{ secrets.SERVICE_NAME }} && \
              exit 1)"

      - name: Cleanup old build
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "rm -rf ${{ secrets.SSH_PROJECT_PATH }}/build-old"

  clear-cache:
    name: Clear Cloudflare cache
    runs-on: ubuntu-latest
    needs:
      - resolve-env
      - deploy
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: wait for 10 seconds
        run: sleep 10
      - name: Clear Cloudflare cache
        run: |
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["${{ secrets.CF_DOMAIN }}"]}')
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.success == true'
